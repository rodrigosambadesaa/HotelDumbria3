name: HotelDumbria
options:
  bundleIdPrefix: org.hoteldumbria
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 2.0
targets:
  HotelDumbria:
    type: application
    platform: iOS
    sources:
      - path: HotelDumbria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hoteldumbria.ios
        PRODUCT_NAME: HotelDumbria
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hotel Dumbría
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Selecciona una imagen para tu foto de perfil.
        INFOPLIST_KEY_API_BASE_URL: http://127.0.0.1:8080/api/v1
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    scheme:
      testTargets: []
