name: Java4Shell (CVE-2026-114938)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

jobs:
  verify-java-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify mitigated JDK and both Dockerfile stages
        shell: bash
        run: |
          set -euo pipefail
          java -XX:+PrintFlagsFinal -version 2>&1 | grep -E 'UseBASE64Intrinsics[[:space:]]+=[[:space:]]+false'
          grep -Fq 'ENV JAVA_TOOL_OPTIONS="-XX:-UseBASE64Intrinsics"' Dockerfile
          grep -Fq 'ENV JAVA_TOOL_OPTIONS="-XX:-UseBASE64Intrinsics"' docker/android-emulator/Dockerfile
          docker compose config --quiet

      - name: Android JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
