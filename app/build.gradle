apply plugin: 'com.android.application'

android {
    namespace "org.hoteldumbria"
    compileSdkVersion 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "org.hoteldumbria"
        minSdkVersion 16
        targetSdkVersion 36
        versionCode 2
        versionName "2.0"
        multiDexEnabled true
        buildConfigField "String", "API_BASE_URL",
                "\"${project.findProperty('HOTEL_API_BASE_URL') ?: 'http://10.0.2.2:8080/api/v1'}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.5.1'
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    testImplementation 'junit:junit:4.13.2'
    // 1.2.x/3.6.x require API 19. Keep the instrumentation suite runnable
    // on the application's real minimum, Android 4.1 (API 16).
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.3'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.3'
}
